version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/share/trick/pymods/trick"
      - "/share/trick/trickops"
    schedule:
      interval: "quarterly"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/trick_source/web/dashboard"
    schedule:
      interval: "quarterly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # VS Code extension: one grouped version-bump PR per quarter, and security
  # fixes grouped into a single PR instead of one per vulnerable package.
  - package-ecosystem: "npm"
    directory: "/vscode-trick"
    schedule:
      interval: "quarterly"
    groups:
      vscode-trick-version:
        applies-to: version-updates
        patterns:
          - "*"
      vscode-trick-security:
        applies-to: security-updates
        patterns:
          - "*"
