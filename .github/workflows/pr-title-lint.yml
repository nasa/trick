name: Lint PR Title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Semantic PR Title Linter
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commit types mapping to the release-please setup
          # Keep this in sync with release-please-config.json's changelog-sections
          # Valid PR title format: '<type>[(<scope>)]: <subject>'
          #     type: one of the types below
          #     scope: optional, can be any string
          #     subject: a short description of the PR, must not be empty
          #     e.g. feat: add new feature or fix(core): fix a bug in core
          types: |
            feat
            fix
            perf
            revert
            refactor
            security
            deprecated
            chore
            docs
            test
            ci
            style
            build

          # types: gatekeeps the type
          # amannn/action-semantic-pull-request@v6 fails a title with no subject