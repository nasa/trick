<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Activity bar icons are rendered by VS Code as monochrome masks (only
       alpha is used), so this can't reuse icons/trick-flag.png - it has to be
       a flat single-color shape instead. A small checkerboard flag on a pole,
       echoing the same racing-flag motif as the file icon. -->
  <rect x="3" y="2" width="2" height="20" fill="#000000" />
  <rect x="5" y="3" width="5" height="3" fill="#000000" />
  <rect x="15" y="3" width="5" height="3" fill="#000000" />
  <rect x="10" y="6" width="5" height="3" fill="#000000" />
  <rect x="5" y="9" width="5" height="3" fill="#000000" />
  <rect x="15" y="9" width="5" height="3" fill="#000000" />
</svg>
